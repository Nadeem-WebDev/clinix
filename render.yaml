# Render Blueprint - one web service that serves both the API and the built
# React app from the same origin. See README "Production Deployment".
#
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo. Render
# asks for every `sync: false` value below during that first setup.
services:
  - type: web
    name: clinix
    runtime: node
    # Free instances sleep after ~15 minutes without traffic (the first
    # request after that takes ~30-60s) and do not run the in-process
    # reminder cron while asleep - KEEP_ALIVE_ENABLED below stops that by
    # pinging itself. Use a paid plan for a clinic in daily use.
    plan: free
    # Pick the region closest to your MongoDB Atlas cluster and your users.
    region: singapore
    # npm ci skips devDependencies when NODE_ENV=production, but the client
    # build needs them (Vite, Tailwind) - so include them, build, then prune.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: npm run start --workspace server
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # This service serves client/dist itself (same origin as the API).
      - key: SERVE_CLIENT
        value: "true"
      # puppeteer is a root devDependency for the E2E script only; without
      # this every deploy downloads a ~170MB Chrome it never uses.
      - key: PUPPETEER_SKIP_DOWNLOAD
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      # Needed for patient document and clinic logo uploads.
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      # Stays off until a Meta WhatsApp Business account and approved
      # templates exist - see README "WhatsApp setup".
      - key: WHATSAPP_ENABLED
        value: "false"
      # Pings this service's own /api/v1/keep-alive every 13 minutes so the
      # free instance never sleeps (see README "Production Deployment").
      # Set to "false" after moving to a paid plan.
      - key: KEEP_ALIVE_ENABLED
        value: "true"
      # CORS_ORIGIN and PUBLIC_APP_URL are deliberately not set: both fall
      # back to RENDER_EXTERNAL_URL, which Render provides. Set them only
      # when adding a custom domain.
