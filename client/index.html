<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinic CRM</title>
    <!--
      Set the theme class before React mounts / before first paint,
      to avoid a flash of the wrong theme on load.
      Reads the persisted preference; falls back to system preference.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('clinic-crm-theme')
          var theme = stored
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* localStorage unavailable, default to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
