<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Clinix – Clinic &amp; OPD Management Software</title>
    <meta
      name="description"
      content="Clinix is clinic management software for small clinics and OPDs: patient records, appointments, a live OPD queue, prescriptions, billing and reports in one place."
    />
    <meta name="application-name" content="Clinix" />
    <meta name="theme-color" content="#2563eb" />

    <!-- Icons: .ico for old browsers and crawlers, SVG for the rest, a
         180px PNG for iOS home screens, and the manifest for Android. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (WhatsApp, LinkedIn, Facebook, X). __SITE_URL__ is
         filled in at build time - see siteMeta() in vite.config.js. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Clinix" />
    <meta property="og:title" content="Clinix – Clinic &amp; OPD Management Software" />
    <meta
      property="og:description"
      content="Patient records, appointments, a live OPD queue, prescriptions and billing for small clinics."
    />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Clinix – clinic and OPD management" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Set the theme class before React mounts / before first paint,
      to avoid a flash of the wrong theme on load.
      Reads the persisted preference; falls back to system preference.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('clinic-crm-theme')
          var theme = stored
          if (!theme || theme === 'system') {
            theme = window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
          }
          if (theme === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          /* localStorage unavailable, default to light */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
